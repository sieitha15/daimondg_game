<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Log In</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
      integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body>
    <div class="background">
      <img src="../img/img-game4.jpg" alt="" class="bg-100vh" />
      <div class="overlay"></div>
      <div class="form-login">
        <div class="row">
          <div class="col-7">
            <img src="../img/img-game8.jpg" alt="" />
            <h1>WELCOME!</h1>
            <center>
              <div id="app"></div>
            </center>
          </div>
          <div class="col-5">
            <form action="../../index.html">
              <div class="txt-login">
                <p class="titled fn">ចូលគណនី</p>
              </div>
              <div class="container">
                <label for="Email" class="email">អុីមែល</label><br />
                <input
                  type="email"
                  class="box-email fn"
                  id="Email"
                  maxlength="24"
                  placeholder="សូមបញ្ចូលអុីមែល"
                />

                <div class="txt-password">
                  <label for="Password" class="password">ពាក្យសម្ងាត់</label>
                  <div class="txt-forgot-pw">ភ្លេចពាក្យសម្ងាត់?</div>
                </div>
                <input
                  type="password"
                  class="box-password fn"
                  id="Password"
                  maxlength="8"
                  placeholder="សូមបញ្ចូលពាក្យសម្ងាត់"
                />
                <div class="message-signin fn">
                  តើមានគណនីហើយឬនៅ​?<span
                    ><a href="" clas="fn">បង្កើតថ្មី</a></span
                  >
                </div>

                <div class="logo">
                  <div class="box-fb">
                    <div class="logo-icon">
                      <i class="fa-brands fa-facebook"></i>
                      <p>Facebook</p>
                    </div>
                  </div>
                  <div class="box-google">
                    <div class="logo-icon">
                      <i class="fa-brands fa-google"></i>
                      <p>Google</p>
                    </div>
                  </div>
                </div>
                <div class="btn-login">
                  <button type="submit">ចូលគណនី</button>
                </div>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
    <script src="https://unpkg.com/typewriter-effect@latest/dist/core.js"></script>
    <script>
      var app = document.getElementById("app");

      var typewriter = new Typewriter(app, {
        loop: true,
      });

      typewriter

        .typeString("<strong>PLASE! LOGIN <strong>")
        .pauseFor(2500)
        .deleteAll()
        .typeString("<strong>YOUR ACCOUNT</strong>")
        .pauseFor(2500)
        .start();
    </script>
  </body>
</html>
